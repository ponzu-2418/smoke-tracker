<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>ボタンのテスト</title>

    <style>
        #my-button{
            font-size: 30px;
            padding: 20px 40px;
        }
        #del-button{
            font-size: 30px;
            padding: 20px 40px;
        }
        .hidden{
            display: none;
        }
    </style>
</head>

<body>
    <div id="nav">
        <button id="nav1">記録</button>
        <button id="nav2">金額</button>
        <button id="nav3">グラフ</button>
    </div>

    <div id="screen1">
        <p id="cig">🚬</p>
        <p id="date1"></p>
        <p id="count">0本</p>
        <button id="my-button">吸った</button>
        <button id="del-button">削除</button>
    </div>

    <div id="screen2">
        <p id="date2"></p>
        <p id="compare"></p>
        <p id="todayMoney"></p>
        <p id="total"></p>
    </div>

    <div id="screen3">
        <canvas id="myChart"></canvas>
        <p id="comment"></p>
    </div>

    <script>
        const btn = document.getElementById('my-button');
        const delBtn = document.getElementById('del-button');
        const countEl = document.getElementById('count');
        const countTl = document.getElementById('total');

        function showScreen(n){
            document.getElementById('screen1').classList.add('hidden')
            document.getElementById('screen2').classList.add('hidden')
            document.getElementById('screen3').classList.add('hidden')
            document.getElementById('screen' + n).classList.remove('hidden')
        }

        function updateDisplay(){
            document.getElementById('date1').textContent = todayStr;
            document.getElementById('date2').textContent = todayStr;
            const todayCount = records.filter(r => r === todayStr).length;

            let todayTotal = price * todayCount
            let total = price * records.length

            let mark;
            if(todayCount < goal){
                mark = '<';
                compare.style.color = 'black';
            }else if(todayCount > goal){
                mark = '>';
                compare.style.color = 'red';
            }else{
                mark = '=';
                compare.style.color = 'black';
            }

            document.getElementById('compare').textContent =
                '今日 ' + todayCount + '本 ' + mark + ' 目標 ' + goal + '本'; 

            document.getElementById('todayMoney').textContent =
                '今日 ' + todayTotal + '円';

            countEl.textContent = todayCount + '本';
            countTl.textContent = '累計金額' + total
            if(todayCount > goal){
                countEl.style.color = 'red'
            }else{
                countEl.style.color = 'black'
            }
        }

        function toStr(d){
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        function updateChart() {
            let count = {};
            records.forEach(function(i){
                count[i] = (count[i] || 0) + 1;
            });

            let data = labels.map(function(day){
                return count[day] || 0;
            });
            const achieved = data.filter(function(n){
                return n <= goal;
            }).length;

            const todayNum = data[6];
            const yesterdayNum = data[5];
            const diff = todayNum - yesterdayNum;
            let msg;
            if(diff < 0){
                msg = '昨日より' + (-diff) + '本減りました'
            }else if(diff > 0){
                msg = '昨日より' + diff + '本増えました';
            }else{
                msg = '昨日と同じ本数です';
            }

            myChart.data.datasets[0].data = data;
            myChart.update();

            document.getElementById('comment').textContent =
                msg + '  /  7日中' + achieved + '日、目標を達成しました';
        }

        document.getElementById('nav1').addEventListener('click', function(){
            showScreen(1);
        })
        document.getElementById('nav2').addEventListener('click', function(){
            showScreen(2);
        })        
        document.getElementById('nav3').addEventListener('click', function(){
            showScreen(3);
        })

        let todayStr = toStr(new Date());

        let goal = 5
        let price = 30

        let records = [];
        const saved = localStorage.getItem('records');

        if(saved !== null){
            records = JSON.parse(saved);
        }

        updateDisplay();

        btn.addEventListener('click', function() {
            records.push(todayStr);
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        });

        delBtn.addEventListener('click', function(){
            const todayCount = records.filter(r => r === todayStr).length;
            if(todayCount > 0){
                records.pop()
            }
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        })

        let labels = [];
        for(let i = 6; i >= 0; i--){
            let d = new Date();
            d.setDate(d.getDate() - i);
            labels.push(toStr(d));
        }

        let myChart = new Chart(document.getElementById('myChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '本数',
                    data: [],
                    borderColor: 'blue',
                    borderWidth: 3
                },
                {
                    label: '目標',
                    data: labels.map(function(){
                        return goal;
                    }),
                    borderColor: 'rgba(255,0,0,0.4)',
                    pointRadius: 0,
                    borderDash: [5,5]
                }]
            }
        });

        updateChart();

    </script>
</body>
</html>
