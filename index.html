<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボタンのテスト</title>
</head>

<body>

    <button id="my-button">ボタン</button>
    <button id="del-button">削除</button>
    <p id="count">0本</p>
    <p id="total">累計金額</p>

    <script>
        const btn = document.getElementById('my-button');
        const delBtn = document.getElementById('del-button');
        const countEl = document.getElementById('count');
        const countTl = document.getElementById('total');

        function updateDisplay(){
            const todayCount = records.filter(r => r === todayStr).length;

            let todayTotal = price * todayCount
            let total = price * records.length

            countEl.textContent = todayCount + '本/目標' + goal + '本/' + todayTotal;
            countTl.textContent = '累計金額' + total
            if(todayCount > goal){
                countEl.style.color = 'red'
            }else{
                countEl.style.color = 'black'
            }
        }

        let today = new Date()
        let year = today.getFullYear()
        let month = today.getMonth() + 1
        let date = today.getDate()
        let todayStr = year + "-" + month + "-" + date
        console.log(todayStr)

        let goal = 5
        let price = 50

        let records = [];
        const saved = localStorage.getItem('records');

        if(saved !== null){
            records = JSON.parse(saved);
        }

        updateDisplay();

        btn.addEventListener('click', function() {
            records.push(todayStr);
            updateDisplay();
            localStorage.setItem('records', JSON.stringify(records));
        });

        delBtn.addEventListener('click', function(){
            const todayCount = records.filter(r => r === todayStr).length;
            if(todayCount > 0){
                records.pop()
            }
            updateDisplay();
            localStorage.setItem('records', JSON.stringify(records));
        })
    </script>
</body>
</html>
