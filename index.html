<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>ボタンのテスト</title>
</head>

<body>

    <button id="my-button">ボタン</button>
    <button id="del-button">削除</button>
    <p id="count">0本</p>
    <p id="total">累計金額</p>
    <canvas id="myChart"></canvas>

    <script>
        const btn = document.getElementById('my-button');
        const delBtn = document.getElementById('del-button');
        const countEl = document.getElementById('count');
        const countTl = document.getElementById('total');

        function updateDisplay(){
            const todayCount = records.filter(r => r === todayStr).length;

            let todayTotal = price * todayCount
            let total = price * records.length

            countEl.textContent = todayCount + '本/目標' + goal + '本/' + todayTotal;
            countTl.textContent = '累計金額' + total
            if(todayCount > goal){
                countEl.style.color = 'red'
            }else{
                countEl.style.color = 'black'
            }
        }

        function toStr(d){
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        function updateChart() {
            let count = {};
            records.forEach(function(i){
                count[i] = (count[i] || 0) + 1;
            });

            let data = labels.map(function(day){
                return count[day] || 0;
            });

            myChart.data.datasets[0].data = data;
            myChart.update();
        }

        let todayStr = toStr(new Date());

        let goal = 5
        let price = 30

        let records = [];
        const saved = localStorage.getItem('records');

        if(saved !== null){
            records = JSON.parse(saved);
        }

        updateDisplay();

        btn.addEventListener('click', function() {
            records.push(todayStr);
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        });

        delBtn.addEventListener('click', function(){
            const todayCount = records.filter(r => r === todayStr).length;
            if(todayCount > 0){
                records.pop()
            }
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        })

        let labels = [];
        for(let i = 6; i >= 0; i--){
            let d = new Date();
            d.setDate(d.getDate() - i);
            labels.push(toStr(d));
        }

        let myChart = new Chart(document.getElementById('myChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '本数',
                    data: [],
                    borderColor: 'blue',
                    borderWidth: 3
                },
                {
                    label: '目標',
                    data: labels.map(function(){
                        return goal;
                    }),
                    borderColor: 'rgba(255,0,0,0.4)',
                    pointRadius: 0,
                    borderDash: [5,5]
                }]
            }
        });
        updateChart();

    </script>
</body>
</html>
