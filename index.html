<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>禁煙サポート</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            background: #F2F5F4;
            color: #2C2C2A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
        }

        /* 画面本体 */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 100px;
        }

        .hidden {
            display: none;
        }

        /* 日付 */
        .date {
            font-size: 14px;
            color: #6B6B66;
            align-self: flex-start;
            margin-bottom: 8px;
        }

        /* --- 画面1 記録 --- */
        #cig {
            font-size: 90px;
            line-height: 1.4;
            margin-top: 40px;
            transition: opacity 0.3s, transform 0.3s;
        }

        #count {
            font-size: 20px;
            color: #6B6B66;
            margin-top: 4px;
            margin-bottom: 48px;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: center;
        }

        #my-button {
            font-size: 26px;
            font-weight: bold;
            padding: 24px 0;
            flex: 2;
            background: #0F6E56;
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        #my-button:active {
            transform: scale(0.95);
            background: #0B5442;
        }

        #del-button {
            font-size: 20px;
            padding: 24px 0;
            flex: 1;
            background: #fff;
            color: #6B6B66;
            border: 1px solid #D3D1C7;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #del-button:active {
            transform: scale(0.95);
        }

        /* --- 画面2 金額 --- */
        .compare-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 48px;
            width: 100%;
        }

        .compare-box {
            text-align: center;
        }

        .compare-label {
            font-size: 15px;
            color: #6B6B66;
            margin-bottom: 8px;
        }

        .compare-num {
            font-size: 44px;
            font-weight: bold;
        }

        .compare-num span {
            font-size: 18px;
            font-weight: normal;
        }

        #mark {
            font-size: 40px;
            font-weight: bold;
            color: #6B6B66;
        }

        .money-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-top: 40px;
            width: 100%;
        }

        .money-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
        }

        .money-line + .money-line {
            border-top: 1px solid #EDEBE3;
        }

        .money-label {
            font-size: 15px;
            color: #6B6B66;
        }

        .money-value {
            font-size: 26px;
            font-weight: bold;
        }

        .money-value span {
            font-size: 15px;
            font-weight: normal;
        }

        /* --- 画面3 グラフ --- */
        .chart-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            margin-top: 24px;
            width: 100%;
        }

        #comment {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-top: 16px;
            width: 100%;
            font-size: 15px;
            line-height: 1.9;
            text-align: center;
        }

        /* --- 下部ナビ --- */
        #nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            background: #fff;
            border-top: 1px solid #E3E1D8;
        }

        #nav button {
            flex: 1;
            padding: 18px 0 24px;
            font-size: 14px;
            background: none;
            border: none;
            color: #9B9A93;
            cursor: pointer;
            font-family: inherit;
        }

        #nav button.active {
            color: #0F6E56;
            font-weight: bold;
            box-shadow: inset 0 2px 0 #0F6E56;
        }
    </style>
</head>

<body>
    <!-- 画面1 記録 -->
    <div id="screen1" class="screen">
        <p id="date1" class="date"></p>
        <p id="cig">🚬</p>
        <p id="count">0本</p>
        <div class="btn-row">
            <button id="my-button">吸った</button>
            <button id="del-button">削除</button>
        </div>
    </div>

    <!-- 画面2 金額 -->
    <div id="screen2" class="screen hidden">
        <p id="date2" class="date"></p>
        <div class="compare-row">
            <div class="compare-box">
                <p class="compare-label">本日</p>
                <p class="compare-num" id="todayNum">0<span>本</span></p>
            </div>
            <p id="mark">&lt;</p>
            <div class="compare-box">
                <p class="compare-label">目標</p>
                <p class="compare-num" id="goalNum">5<span>本</span></p>
            </div>
        </div>
        <div class="money-card">
            <div class="money-line">
                <span class="money-label">今日</span>
                <span class="money-value" id="todayMoney">0<span>円</span></span>
            </div>
            <div class="money-line">
                <span class="money-label">これまで累計</span>
                <span class="money-value" id="total">0<span>円</span></span>
            </div>
        </div>
    </div>

    <!-- 画面3 グラフ -->
    <div id="screen3" class="screen hidden">
        <div class="chart-card">
            <canvas id="myChart"></canvas>
        </div>
        <p id="comment"></p>
    </div>

    <!-- 下部ナビ -->
    <div id="nav">
        <button id="nav1" class="active">記録</button>
        <button id="nav2">金額</button>
        <button id="nav3">グラフ</button>
    </div>

    <script>
        const btn = document.getElementById('my-button');
        const delBtn = document.getElementById('del-button');
        const countEl = document.getElementById('count');
        const cigEl = document.getElementById('cig');
        const markEl = document.getElementById('mark');
        const todayNumEl = document.getElementById('todayNum');
        const goalNumEl = document.getElementById('goalNum');
        const todayMoneyEl = document.getElementById('todayMoney');
        const totalEl = document.getElementById('total');

        let goal = 5;
        let price = 30;

        function showScreen(n) {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');
            document.getElementById('screen' + n).classList.remove('hidden');

            document.getElementById('nav1').classList.remove('active');
            document.getElementById('nav2').classList.remove('active');
            document.getElementById('nav3').classList.remove('active');
            document.getElementById('nav' + n).classList.add('active');
        }

        function toStr(d) {
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        // 本数に応じてタバコの見た目を変える
        function updateCig(todayCount) {
            if (todayCount === 0) {
                cigEl.textContent = '🚭';
                cigEl.style.opacity = 1;
                cigEl.style.transform = 'rotate(0deg)';
            } else if (todayCount > goal) {
                cigEl.textContent = '🔥';
                cigEl.style.opacity = 1;
                cigEl.style.transform = 'rotate(0deg)';
            } else {
                cigEl.textContent = '🚬';
                // 吸うほど薄く、傾いていく
                const ratio = todayCount / goal;
                cigEl.style.opacity = 1 - ratio * 0.5;
                cigEl.style.transform = 'rotate(' + (ratio * 20) + 'deg)';
            }
        }

        function updateDisplay() {
            document.getElementById('date1').textContent = todayStr;
            document.getElementById('date2').textContent = todayStr;

            const todayCount = records.filter(r => r === todayStr).length;
            const todayTotal = price * todayCount;
            const total = price * records.length;

            // 画面1
            countEl.textContent = todayCount + '本';
            updateCig(todayCount);

            // 画面2 対比
            todayNumEl.innerHTML = todayCount + '<span>本</span>';
            goalNumEl.innerHTML = goal + '<span>本</span>';

            if (todayCount < goal) {
                markEl.textContent = '<';
                todayNumEl.style.color = '#0F6E56';
            } else if (todayCount > goal) {
                markEl.textContent = '>';
                todayNumEl.style.color = '#A32D2D';
            } else {
                markEl.textContent = '=';
                todayNumEl.style.color = '#2C2C2A';
            }

            // 画面2 金額
            todayMoneyEl.innerHTML = todayTotal + '<span>円</span>';
            totalEl.innerHTML = total + '<span>円</span>';
        }

        function updateChart() {
            let count = {};
            records.forEach(function (i) {
                count[i] = (count[i] || 0) + 1;
            });

            let data = labels.map(function (day) {
                return count[day] || 0;
            });

            const achieved = data.filter(function (n) {
                return n <= goal;
            }).length;

            const diff = data[6] - data[5];
            let msg;
            if (diff < 0) {
                msg = '昨日より ' + (-diff) + '本 減りました';
            } else if (diff > 0) {
                msg = '昨日より ' + diff + '本 増えました';
            } else {
                msg = '昨日と同じ本数です';
            }

            myChart.data.datasets[0].data = data;
            myChart.update();

            document.getElementById('comment').innerHTML =
                msg + '<br>7日中 ' + achieved + '日、目標を達成しました';
        }

        document.getElementById('nav1').addEventListener('click', function () { showScreen(1); });
        document.getElementById('nav2').addEventListener('click', function () { showScreen(2); });
        document.getElementById('nav3').addEventListener('click', function () { showScreen(3); });

        let todayStr = toStr(new Date());

        let records = [];
        const saved = localStorage.getItem('records');
        if (saved !== null) {
            records = JSON.parse(saved);
        }

        btn.addEventListener('click', function () {
            records.push(todayStr);
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        });

        delBtn.addEventListener('click', function () {
            const todayCount = records.filter(r => r === todayStr).length;
            if (todayCount > 0) {
                records.pop();
            }
            updateDisplay();
            updateChart();
            localStorage.setItem('records', JSON.stringify(records));
        });

        let labels = [];
        for (let i = 6; i >= 0; i--) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            labels.push(toStr(d));
        }

        let myChart = new Chart(document.getElementById('myChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '本数',
                    data: [],
                    borderColor: '#0F6E56',
                    backgroundColor: '#0F6E56',
                    borderWidth: 3,
                    tension: 0.3
                },
                {
                    label: '目標',
                    data: labels.map(function () { return goal; }),
                    borderColor: 'rgba(163,45,45,0.4)',
                    pointRadius: 0,
                    borderDash: [5, 5],
                    borderWidth: 2
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                },
                plugins: {
                    legend: { labels: { boxWidth: 12, font: { size: 11 } } }
                }
            }
        });

        updateDisplay();
        updateChart();
        showScreen(1);
    </script>
</body>
</html>
